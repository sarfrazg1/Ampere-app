name: Build APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Flutter (Conditional)
        if: hashFiles('pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "Building with Flutter..."
            flutter pub get
            flutter build apk --release
          else
            echo "Building with Gradle..."
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Locate Generated APK
        id: find_apk
        run: |
          echo "Locating built APK files..."
          APK_PATH=$(find . -path "*/outputs/*apk*/*.apk" -not -path "*/androidTest/*" | head -n 1)
          
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: No APK found!" >&2
            find . -name "*.apk" || true
            exit 1
          fi
          
          echo "Found APK: $APK_PATH"
          mkdir -p build_output
          cp "$APK_PATH" build_output/SmartCharging-VoiceAlert.apk
          cp "$APK_PATH" build_output/app-debug.apk
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SmartCharging-APK
          path: build_output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Smart Charging Checker Build #${{ github.run_number }}"
          
          NOTES="Automatic APK build generated by GitHub Actions for commit ${{ github.sha }}."
          
          gh release create "$TAG" "build_output/app-debug.apk" "build_output/SmartCharging-VoiceAlert.apk" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest || echo "Release creation skipped or insufficient token permissions."

      - name: Print Download Info
        if: always()
        run: |
          echo "===================================================="
          echo "✅ APK build process completed."
          echo "You can download the APK artifact from the Actions tab:"
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "===================================================="
